openapi: 3.1.0
info:
  title: XQ Kraken Workshop Widgets API
  version: 1.0.0
  description: Project-owned teaching contract used by xq-kraken tests and workshop checkpoints.
servers:
  - url: http://127.0.0.1:8765
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Return widgets, optionally limited to a requested count.
      tags: [widgets]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Widget collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
    post:
      operationId: createWidget
      summary: Create a widget
      description: Create and return one widget.
      tags: [widgets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWidgetRequest"
      responses:
        "201":
          description: Widget created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      summary: Get a widget
      description: Return one widget by its stable identifier.
      tags: [widgets]
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Widget found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "404":
          description: Widget not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    CreateWidgetRequest:
      type: object
      additionalProperties: false
      required: [name, quantity]
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
    Widget:
      type: object
      additionalProperties: false
      required: [id, name, quantity]
      properties:
        id:
          type: string
        name:
          type: string
        quantity:
          type: integer
    Error:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
