[project]
name = "xq-kraken"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "aiopenapi3==0.10.0",
  "httpx>=0.28,<0.29",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
kraken = "kraken.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "behave>=1.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kraken"]

[tool.uv]
package = true

[tool.basedpyright]
include = ["kraken", "tests", "features/steps"]
exclude = ["**/__pycache__", ".venv", "dist"]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
