name: ios-xq-fitness-app
options:
  bundleIdPrefix: com.xq.fitness
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  FitnessCore:
    path: FitnessCore
targets:
  ios-xq-fitness-app:
    type: application
    platform: iOS
    sources:
      - App
    resources:
      - App/Assets.xcassets
    dependencies:
      - package: FitnessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xq.fitness.ios-xq-fitness-app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T99X93V7Y2
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"

  ios-xq-fitness-appUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
      - App/FitnessAccessibility.swift
    dependencies:
      - target: ios-xq-fitness-app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xq.fitness.ios-xq-fitness-appUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ios-xq-fitness-app:
    build:
      targets:
        ios-xq-fitness-app: all

  ios-xq-fitness-app-ui-tests:
    build:
      targets:
        ios-xq-fitness-app: all
        ios-xq-fitness-appUITests: [test]
    test:
      targets:
        - ios-xq-fitness-appUITests
