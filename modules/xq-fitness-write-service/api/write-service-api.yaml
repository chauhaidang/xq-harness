openapi: 3.0.3
info:
  title: XQ Fitness API
  description: Unified read and write API for workout routines and related data
  version: 3.0.1
  contact:
    name: XQ Fitness Team

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

paths:
  /muscle-groups:
    get:
      summary: Get all muscle groups
      description: Retrieves a list of all available muscle groups
      operationId: getMuscleGroups
      tags:
        - Muscle Groups
      responses:
        '200':
          description: Successfully retrieved muscle groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MuscleGroup'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /routines:
    get:
      summary: Get all workout routines
      description: Retrieves a list of all workout routines
      operationId: getRoutines
      tags:
        - Routines
      parameters:
        - name: isActive
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Successfully retrieved routines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutRoutine'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new workout routine
      description: Creates a new workout routine
      operationId: createRoutine
      tags:
        - Routines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineRequest'
      responses:
        '201':
          description: Routine created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /routines/{routineId}:
    get:
      summary: Get a specific workout routine
      description: |
        Retrieves a workout routine with all its days, sets configuration (deprecated), and exercises.
      operationId: getRoutineById
      tags:
        - Routines
      parameters:
        - name: routineId
          in: path
          description: ID of the routine to retrieve
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved routine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutRoutineDetail'
        '404':
          description: Routine not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a workout routine
      description: Updates an existing workout routine
      operationId: updateRoutine
      tags:
        - Routines
      parameters:
        - name: routineId
          in: path
          description: ID of the routine to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoutineRequest'
      responses:
        '200':
          description: Routine updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Routine not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a workout routine
      description: Deletes a workout routine and all associated data
      operationId: deleteRoutine
      tags:
        - Routines
      parameters:
        - name: routineId
          in: path
          description: ID of the routine to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Routine deleted successfully
        '404':
          description: Routine not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workout-days:
    post:
      summary: Create a new workout day
      description: Creates a new workout day for a routine
      operationId: createWorkoutDay
      tags:
        - Workout Days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkoutDayRequest'
      responses:
        '201':
          description: Workout day created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDayResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Routine not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workout-days/{dayId}:
    put:
      summary: Update a workout day
      description: Updates an existing workout day
      operationId: updateWorkoutDay
      tags:
        - Workout Days
      parameters:
        - name: dayId
          in: path
          description: ID of the workout day to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkoutDayRequest'
      responses:
        '200':
          description: Workout day updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDayResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workout day not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a workout day
      description: Deletes a workout day and all associated sets
      operationId: deleteWorkoutDay
      tags:
        - Workout Days
      parameters:
        - name: dayId
          in: path
          description: ID of the workout day to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Workout day deleted successfully
        '404':
          description: Workout day not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exercises:
    get:
      summary: Get exercises for a workout day
      description: |
        Retrieves exercises for a workout day, optionally filtered by muscle group.
      operationId: getExercises
      tags:
        - Exercises
      parameters:
        - name: workoutDayId
          in: query
          description: Filter by workout day (required)
          required: true
          schema:
            type: integer
            format: int64
        - name: muscleGroupId
          in: query
          description: Filter by muscle group (optional)
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exercise'
        '400':
          description: Invalid request (missing workoutDayId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new exercise
      description: |
        Creates a new exercise for a muscle group in a workout day. Simplified model: stores total reps, weight, and total sets directly.
        Multiple exercises can be associated with the same muscle group.
      operationId: createExercise
      tags:
        - Exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExerciseRequest'
      responses:
        '201':
          description: Exercise created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workout day or muscle group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exercises/{exerciseId}:
    get:
      summary: Get exercise details by ID
      description: Retrieves exercise details including total reps, weight, and total sets
      operationId: getExercise
      tags:
        - Exercises
      parameters:
        - name: exerciseId
          in: path
          description: ID of the exercise to retrieve
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Exercise retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '404':
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update exercise information
      description: |
        Updates exercise information. Can update any combination of fields (exerciseName, totalReps, weight, totalSets, notes).
        All fields are optional - omitted fields remain unchanged (partial update supported).
      operationId: updateExercise
      tags:
        - Exercises
      parameters:
        - name: exerciseId
          in: path
          description: ID of the exercise to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExerciseRequest'
      responses:
        '200':
          description: Exercise updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete an exercise
      description: Deletes an exercise
      operationId: deleteExercise
      tags:
        - Exercises
      parameters:
        - name: exerciseId
          in: path
          description: ID of the exercise to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Exercise deleted successfully
        '404':
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workout-day-sets:
    post:
      summary: Add sets configuration to a workout day
      description: |
        Creates a new sets configuration for a muscle group on a workout day.

        **Upsert behavior:** If a sets configuration already exists for the given workout day and muscle group,
        it will be updated instead of creating a new one. This prevents duplicate entries and allows
        easy updates without needing to know the setId.

        **Deprecated:** This endpoint is deprecated. Use `POST /exercises` instead.
      deprecated: true
      operationId: createWorkoutDaySet
      tags:
        - Workout Day Sets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkoutDaySetRequest'
      responses:
        '201':
          description: Sets configuration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDaySetResponse'
        '200':
          description: Sets configuration updated successfully (when it already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDaySetResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workout day or muscle group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workout-day-sets/{setId}:
    put:
      summary: Update sets configuration
      description: |
        Updates the number of sets for a muscle group on a workout day.

        **Usage options:**
        1. Provide `setId` in the path (e.g., `/workout-day-sets/123`) - traditional method
        2. Provide `workoutDayId` and `muscleGroupId` as query parameters (e.g., `/workout-day-sets/0?workoutDayId=1&muscleGroupId=2`) - alternative method when setId is unknown

        When query parameters are provided, they take precedence and the setId in the path is ignored.
      operationId: updateWorkoutDaySet
      tags:
        - Workout Day Sets
      parameters:
        - name: setId
          in: path
          description: ID of the sets configuration to update. Can be any value (e.g., 0) when using query parameters.
          required: true
          schema:
            type: integer
            format: int64
        - name: workoutDayId
          in: query
          description: ID of the workout day (alternative to setId). Must be provided together with muscleGroupId.
          required: false
          schema:
            type: integer
            format: int64
        - name: muscleGroupId
          in: query
          description: ID of the muscle group (alternative to setId). Must be provided together with workoutDayId.
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkoutDaySetRequest'
      responses:
        '200':
          description: Sets configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDaySetResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sets configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete sets configuration
      description: |
        Removes a sets configuration from a workout day.

        **Deprecated:** This endpoint is deprecated. Use `DELETE /exercises/{exerciseId}` instead.
      deprecated: true
      operationId: deleteWorkoutDaySet
      tags:
        - Workout Day Sets
      parameters:
        - name: setId
          in: path
          description: ID of the sets configuration to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Sets configuration deleted successfully
        '404':
          description: Sets configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /routines/{routineId}/days:
    get:
      summary: Get all workout days for a routine
      description: Retrieves all workout days for a specific routine
      operationId: getWorkoutDays
      tags:
        - Workout Days
      parameters:
        - name: routineId
          in: path
          description: ID of the routine
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved workout days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutDayDetail'
        '404':
          description: Routine not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /routines/{routineId}/weekly-report:
    get:
      summary: Get weekly report for a routine
      description: |
        Retrieves a weekly report showing total sets per muscle group and exercise-level totals.
      operationId: getWeeklyReport
      tags:
        - Reports
      parameters:
        - name: routineId
          in: path
          description: ID of the routine to get report for
          required: true
          schema:
            type: integer
            format: int64
        - name: weekStartDate
          in: query
          description: Optional week start date (Monday) in ISO 8601 format (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Weekly report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReportResponse'
        '404':
          description: Routine not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /routines/{routineId}/snapshots:
    post:
      summary: Create a weekly snapshot for a routine
      description: |
        Creates a snapshot of the current routine data (workout days and sets) for the current week,
        then resets all sets (numberOfSets) to zero. The snapshot preserves the complete state at
        the time of creation. If a snapshot already exists for the current week, it will be replaced.
      operationId: createWeeklySnapshot
      tags:
        - Snapshots
      parameters:
        - name: routineId
          in: path
          description: ID of the routine to snapshot
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Snapshot created successfully and sets reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySnapshotResponse'
        '400':
          description: Invalid request (routine not found, invalid week calculation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Routine not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CreateRoutineRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Push Pull Legs"
        description:
          type: string
          maxLength: 1000
          example: "3-day split focusing on push, pull, and leg movements"
        isActive:
          type: boolean
          default: true

    UpdateRoutineRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Updated Routine Name"
        description:
          type: string
          maxLength: 1000
          example: "Updated description"
        isActive:
          type: boolean

    RoutineResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Push Pull Legs"
        description:
          type: string
          example: "3-day split focusing on push, pull, and leg movements"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWorkoutDayRequest:
      type: object
      required:
        - routineId
        - dayNumber
        - dayName
      properties:
        routineId:
          type: integer
          format: int64
          example: 1
        dayNumber:
          type: integer
          minimum: 1
          example: 1
        dayName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Push Day"
        notes:
          type: string
          maxLength: 1000
          example: "Focus on chest and shoulders"

    UpdateWorkoutDayRequest:
      type: object
      properties:
        dayNumber:
          type: integer
          minimum: 1
          example: 1
        dayName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Updated Push Day"
        notes:
          type: string
          maxLength: 1000
          example: "Updated notes"

    WorkoutDayResponse:
      type: object
      required:
        - id
        - routineId
        - dayNumber
        - dayName
      properties:
        id:
          type: integer
          format: int64
          example: 1
        routineId:
          type: integer
          format: int64
          example: 1
        dayNumber:
          type: integer
          example: 1
        dayName:
          type: string
          example: "Push Day"
        notes:
          type: string
          example: "Focus on chest and shoulders"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWorkoutDaySetRequest:
      type: object
      required:
        - workoutDayId
        - muscleGroupId
        - numberOfSets
      properties:
        workoutDayId:
          type: integer
          format: int64
          example: 1
        muscleGroupId:
          type: integer
          format: int64
          example: 1
        numberOfSets:
          type: integer
          minimum: 1
          example: 4
        notes:
          type: string
          maxLength: 1000
          example: "Focus on progressive overload"

    UpdateWorkoutDaySetRequest:
      type: object
      properties:
        numberOfSets:
          type: integer
          minimum: 1
          example: 5
        notes:
          type: string
          maxLength: 1000
          example: "Updated notes"

    WorkoutDaySetResponse:
      type: object
      required:
        - id
        - workoutDayId
        - muscleGroupId
        - numberOfSets
      properties:
        id:
          type: integer
          format: int64
          example: 1
        workoutDayId:
          type: integer
          format: int64
          example: 1
        muscleGroupId:
          type: integer
          format: int64
          example: 1
        numberOfSets:
          type: integer
          example: 4
        notes:
          type: string
          example: "Focus on progressive overload"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateExerciseRequest:
      type: object
      required:
        - workoutDayId
        - muscleGroupId
        - exerciseName
        - totalReps
        - weight
        - totalSets
      properties:
        workoutDayId:
          type: integer
          format: int64
          example: 1
        muscleGroupId:
          type: integer
          format: int64
          example: 3
        exerciseName:
          type: string
          minLength: 1
          maxLength: 200
          example: "Bench Press"
        totalReps:
          type: integer
          format: int64
          minimum: 0
          description: Total number of repetitions across all sets
          example: 30
        weight:
          type: number
          format: decimal
          minimum: 0
          description: Weight used (can represent average weight or single weight value)
          example: 135
        totalSets:
          type: integer
          format: int64
          minimum: 0
          description: Total number of sets performed
          example: 3
        notes:
          type: string
          maxLength: 1000
          example: "Focus on form"

    UpdateExerciseRequest:
      type: object
      properties:
        exerciseName:
          type: string
          minLength: 1
          maxLength: 200
          example: "Bench Press"
        totalReps:
          type: integer
          format: int64
          minimum: 0
          description: Total number of repetitions across all sets
          example: 35
        weight:
          type: number
          format: decimal
          minimum: 0
          description: Weight used (can represent average weight or single weight value)
          example: 140
        totalSets:
          type: integer
          format: int64
          minimum: 0
          description: Total number of sets performed
          example: 3
        notes:
          type: string
          maxLength: 1000
          example: "Updated notes"

    ExerciseResponse:
      type: object
      required:
        - id
        - workoutDayId
        - muscleGroupId
        - exerciseName
        - totalReps
        - weight
        - totalSets
      properties:
        id:
          type: integer
          format: int64
          example: 1
