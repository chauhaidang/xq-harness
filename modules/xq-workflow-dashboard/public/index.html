<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>XQ Workflow Observatory</title>
    <meta name="description" content="Operational health and recent history for xq-harness GitHub workflows.">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js?v=local-live"></script>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main>
      <header class="masthead reveal">
        <div>
          <p class="eyebrow">XQ / Actions telemetry</p>
          <h1>Workflow<br><i>Observatory</i></h1>
        </div>
        <div class="masthead-meta">
          <a id="repository-link" class="repo-link" href="https://github.com/chauhaidang/xq-harness/actions">Open GitHub Actions <span aria-hidden="true">↗</span></a>
          <p id="generated-at">Loading telemetry…</p>
        </div>
      </header>

      <div id="error" class="error" role="alert" hidden></div>
      <section id="summary" class="summary-grid reveal" aria-label="Workflow summary" aria-live="polite"></section>

      <section id="active-section" class="section reveal" hidden>
        <div class="section-heading">
          <div><p class="eyebrow">Right now</p><h2>Runs in motion</h2></div>
          <span class="live-mark"><span></span> Live</span>
        </div>
        <div id="active-runs" class="active-runs"></div>
      </section>

      <section class="section reveal">
        <div class="section-heading">
          <div><p class="eyebrow">Fleet health</p><h2>Module signals</h2></div>
        </div>
        <form id="filters" class="filters" aria-label="Filter workflows">
          <label class="search-field"><span class="sr-only">Search modules</span><input id="search" type="search" placeholder="Find a module…" autocomplete="off"></label>
          <label><span class="sr-only">Workflow type</span><select id="type-filter"><option value="">All types</option><option value="ci">CI</option><option value="cd">CD</option><option value="release">Release</option></select></label>
          <label><span class="sr-only">Status</span><select id="status-filter"><option value="">All states</option><option value="success">Successful</option><option value="failure">Failed</option><option value="active">Active</option><option value="stale">Stale</option></select></label>
          <label><span class="sr-only">Event</span><select id="event-filter"><option value="">All events</option></select></label>
          <label><span class="sr-only">Branch</span><select id="branch-filter"><option value="">All branches</option></select></label>
        </form>
        <div id="module-grid" class="module-grid"></div>
        <p id="empty-state" class="empty-state" hidden>No workflow signals match these filters.</p>
      </section>

      <section class="section reveal">
        <div class="section-heading">
          <div><p class="eyebrow">Recent activity</p><h2>Run ledger</h2></div>
        </div>
        <div class="table-shell">
          <table>
            <thead><tr><th>Workflow</th><th>State</th><th>Ref</th><th>Event</th><th>Duration</th><th>Updated</th></tr></thead>
            <tbody id="run-history"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer><span>XQ Harness</span><span>Generated from GitHub Actions</span></footer>
  </body>
</html>
