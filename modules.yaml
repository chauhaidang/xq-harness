version: 1

modules:
  xq-kraken:
    path: modules/xq-kraken
    language: python
    test_all: false
    toolchain:
      python: "3.14"
      uv: required
      basedpyright: required
    commands:
      install: uv sync --locked
      build: SOURCE_DATE_EPOCH=0 uv run basedpyright && uv build
      test: >
        uv run python -m unittest discover -s tests &&
        uv run behave features &&
        uv run behave workshop/features/checkpoints.feature

  # Native iOS apps share the unit + Simulator UI strategy in
  # docs/product/ios-native-app-test-strategy.md. `test` is unit-only; UI
  # schemes never run through this registry or CI.
  ios-xq-finance-app:
    path: modules/ios-xq-finance-app
    language: ios
    test_all: false
    toolchain:
      xcode: "16"
      xcodegen: required
    commands:
      install: "true"
      build: >
        xcodebuild -project ios-xq-finance-app.xcodeproj
        -scheme ios-xq-finance-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        build
      test: >
        xcodebuild -project ios-xq-finance-app.xcodeproj
        -scheme ios-xq-finance-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        test

  ios-xq-fitness-app:
    path: modules/ios-xq-fitness-app
    language: ios
    test_all: false
    toolchain:
      swift: "5.10+"
      xcode: "16"
      xcodegen: required
    commands:
      install: xcodegen generate
      build: >
        xcodebuild -project ios-xq-fitness-app.xcodeproj
        -scheme ios-xq-fitness-app
        -destination 'generic/platform=iOS'
        CODE_SIGNING_ALLOWED=NO
        build
      test: swift test --package-path FitnessCore

  # ── XQ packages (Level C: published semver, independent modules) ──────────────
  # Harness-lineage packages: @chauhaidang/xq-harness-* (see ADR 0010).
  # Modules install and run locally; cross-module consumers use published semver.

  xq-common-kit:
    path: modules/xq-common-kit
    language: node
    test_all: true
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-test-utils:
    path: modules/xq-test-utils
    language: node
    test_all: true
    depends_on:
      - xq-common-kit
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-test-infra:
    path: modules/xq-test-infra
    language: node
    test_all: true
    depends_on:
      - xq-common-kit
    toolchain:
      node: ">=22"
      npm: "11"
      docker: optional
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-skills:
    path: modules/xq-skills
    language: node
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-fitness-mobile:
    path: modules/xq-fitness-mobile
    language: node
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11"
      expo: "49"
      xcode: "16 (local device only)"
      cocoapods: local-device-only
    commands:
      install: npm ci --include=dev
      build: npm run build:check
      test: npm run test:unit

  xq-fitness-write-service:
    path: modules/xq-fitness-write-service
    language: node
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11.16.0"
      docker: optional
    commands:
      install: npm run generate:client && npm ci --include=dev
      build: npm run build
      test: npm run test:unit -- --runInBand

  xq-fitness-db:
    path: modules/xq-fitness-db
    language: node
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11.16.0"
      docker: optional
    commands:
      install: npm ci --include=dev
      build: npm exec prisma validate
      test: npm test

  xq-scripts:
    path: modules/xq-scripts
    language: shell
    test_all: false
    commands:
      install: "true"
      build: "true"
      test: "true"
