version: 1

modules:
  xq-domain-test-mcp:
    path: modules/xq-domain-test-mcp
    language: python
    test_all: false
    toolchain:
      python: "3.12"
      uv: required
      basedpyright: required
    commands:
      install: uv sync --locked
      build: SOURCE_DATE_EPOCH=0 uv run basedpyright && uv build
      test: uv run pytest

  ios-xq-finance-app:
    path: modules/ios-xq-finance-app
    language: ios
    test_all: false
    toolchain:
      xcode: "16"
      xcodegen: required
    commands:
      install: "true"
      build: >
        xcodebuild -project ios-xq-finance-app.xcodeproj
        -scheme ios-xq-finance-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        build
      test: >
        xcodebuild -project ios-xq-finance-app.xcodeproj
        -scheme ios-xq-finance-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        test

  ios-xq-fitness-app:
    path: modules/ios-xq-fitness-app
    language: ios
    test_all: false
    toolchain:
      swift: "5.10+"
      xcode: "16"
      xcodegen: required
    commands:
      install: xcodegen generate
      build: >
        xcodebuild -project ios-xq-fitness-app.xcodeproj
        -scheme ios-xq-fitness-app
        -destination 'generic/platform=iOS'
        CODE_SIGNING_ALLOWED=NO
        build
      test: swift test --package-path FitnessCore

  xq-ios-shell-app:
    path: modules/xq-ios-shell-app
    language: ios
    test_all: false
    toolchain:
      xcode: "16"
      xcodegen: required
      node: ">=22"
    commands:
      install: "true"
      build: >
        xcodebuild -workspace xq-ios-shell-app.xcworkspace
        -scheme xq-ios-shell-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        build
      test: >
        xcodebuild -workspace xq-ios-shell-app.xcworkspace
        -scheme xq-ios-shell-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        test

  xq-ios-ui-test-framework:
    path: modules/xq-ios-ui-test-framework
    language: swift
    test_all: false
    toolchain:
      swift: "5.10+"
      xcode: "16"
      xcbeautify: "3.2.1"
    commands:
      install: swift package resolve
      build: swift build
      test: swift test

  # ── XQ packages (Level C: published semver, independent modules) ──────────────
  # Harness-lineage packages: @chauhaidang/xq-harness-* (see ADR 0010).
  # Modules install and run locally; cross-module consumers use published semver.

  xq-common-kit:
    path: modules/xq-common-kit
    language: node
    test_all: true
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-test-utils:
    path: modules/xq-test-utils
    language: node
    test_all: true
    depends_on:
      - xq-common-kit
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-test-infra:
    path: modules/xq-test-infra
    language: node
    test_all: true
    depends_on:
      - xq-common-kit
    toolchain:
      node: ">=22"
      npm: "11"
      docker: optional
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-octopus:
    path: modules/xq-octopus
    language: node
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-skills:
    path: modules/xq-skills
    language: node
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-workflow-dashboard:
    path: modules/xq-workflow-dashboard
    language: node
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm ci --include=dev
      build: npm run build
      test: npm test

  xq-scripts:
    path: modules/xq-scripts
    language: shell
    test_all: false
    commands:
      install: "true"
      build: "true"
      test: "true"

  poc:
    path: modules/poc
    language: mixed
    test_all: false
    commands:
      install: "true"
      build: "true"
      test: "true"
