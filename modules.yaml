version: 1

modules:
  xq-domain-test-mcp:
    path: modules/xq-domain-test-mcp
    language: python
    version: 1.0.3
    test_all: false
    toolchain:
      python: "3.12"
      uv: required
      basedpyright: required
    commands:
      install: uv sync --locked
      build: SOURCE_DATE_EPOCH=0 uv run basedpyright && uv build
      test: uv run pytest

  ios-xq-finance-app:
    path: modules/ios-xq-finance-app
    language: ios
    version: 0.1.0
    test_all: false
    toolchain:
      xcode: "16"
      xcodegen: required
    commands:
      install: "true"
      build: >
        xcodebuild -project ios-xq-finance-app.xcodeproj
        -scheme ios-xq-finance-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        build
      test: >
        xcodebuild -project ios-xq-finance-app.xcodeproj
        -scheme ios-xq-finance-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        test

  xq-ios-shell-app:
    path: modules/xq-ios-shell-app
    language: ios
    version: 0.1.0
    test_all: false
    toolchain:
      xcode: "16"
      xcodegen: required
      node: ">=22"
    commands:
      install: "true"
      build: >
        xcodebuild -workspace xq-ios-shell-app.xcworkspace
        -scheme xq-ios-shell-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        build
      test: >
        xcodebuild -workspace xq-ios-shell-app.xcworkspace
        -scheme xq-ios-shell-app
        -destination 'platform=iOS Simulator,name=iPhone 16'
        test

  xq-ios-ui-test-framework:
    path: modules/xq-ios-ui-test-framework
    language: swift
    version: 0.1.0
    test_all: false
    toolchain:
      swift: "5.10+"
      xcode: "16"
      xcbeautify: "3.2.1"
    commands:
      install: swift package resolve
      build: swift build
      test: swift test

  # ── XQ packages (Level C: published semver, independent modules) ──────────────
  # Harness-lineage packages: @chauhaidang/xq-harness-* (see ADR 0010).
  # Monorepo uses npm workspaces for sibling deps; external consumers use semver.

  xq-common-kit:
    path: modules/xq-common-kit
    workspace: modules/xq-common-kit
    language: node
    version: 0.1.0
    test_all: true
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm --prefix ../.. install --workspaces --include-workspace-root=false
      build: npm --prefix ../.. run build --workspace modules/xq-common-kit
      test: npm --prefix ../.. test --workspace modules/xq-common-kit

  xq-test-utils:
    path: modules/xq-test-utils
    workspace: modules/xq-test-utils
    language: node
    version: 0.1.0
    test_all: true
    depends_on:
      - xq-common-kit
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm --prefix ../.. install --workspaces --include-workspace-root=false
      build: npm --prefix ../.. run build --workspace modules/xq-test-utils
      test: npm --prefix ../.. test --workspace modules/xq-test-utils

  xq-test-infra:
    path: modules/xq-test-infra
    workspace: modules/xq-test-infra
    language: node
    version: 0.1.1
    test_all: true
    depends_on:
      - xq-common-kit
    toolchain:
      node: ">=22"
      npm: "11"
      docker: optional
    commands:
      install: npm --prefix ../.. install --workspaces --include-workspace-root=false
      build: npm --prefix ../.. run build --workspace modules/xq-test-infra
      test: npm --prefix ../.. test --workspace modules/xq-test-infra

  xq-test-harness:
    path: modules/xq-test-harness
    workspace: modules/xq-test-harness
    language: node
    version: 0.1.0
    test_all: true
    toolchain:
      node: ">=22"
      npm: "11"
      playwright: required
    commands:
      install: npm --prefix ../.. install --workspaces --include-workspace-root=false
      build: npm --prefix ../.. run build --workspace modules/xq-test-harness
      test: npm --prefix ../.. test --workspace modules/xq-test-harness

  xq-test-harness-e2e-consumer:
    path: modules/xq-test-harness-e2e-consumer
    workspace: modules/xq-test-harness-e2e-consumer
    language: node
    version: 0.0.0
    test_all: true
    depends_on:
      - xq-test-harness
    toolchain:
      node: ">=22"
      npm: "11"
      playwright: required
    commands:
      install: npm --prefix ../.. install --workspaces --include-workspace-root=false
      build: npm --prefix ../.. run build --workspace modules/xq-test-harness-e2e-consumer
      test: npm --prefix ../.. test --workspace modules/xq-test-harness-e2e-consumer

  xq-octopus:
    path: modules/xq-octopus
    workspace: modules/xq-octopus
    language: node
    version: 0.1.0
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm --prefix ../.. install --workspaces --include-workspace-root=false
      build: npm --prefix ../.. run build --workspace modules/xq-octopus
      test: npm --prefix ../.. test --workspace modules/xq-octopus

  xq-skills:
    path: modules/xq-skills
    workspace: modules/xq-skills
    language: node
    version: 0.1.0
    test_all: false
    toolchain:
      node: ">=22"
      npm: "11"
    commands:
      install: npm --prefix ../.. install --workspaces --include-workspace-root=false
      build: npm --prefix ../.. run build --workspace modules/xq-skills
      test: npm --prefix ../.. test --workspace modules/xq-skills

  xq-scripts:
    path: modules/xq-scripts
    language: shell
    version: 0.0.0
    test_all: false
    commands:
      install: "true"
      build: "true"
      test: "true"

  poc:
    path: modules/poc
    language: mixed
    version: 0.0.0
    test_all: false
    commands:
      install: "true"
      build: "true"
      test: "true"
