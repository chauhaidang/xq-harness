name: CD xq-scripts

on:
  push:
    branches: [main]
    paths:
      - modules/xq-scripts/version.yaml
      - modules/xq-scripts/VERSION
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/module-cd-tarball.yml
    secrets: inherit
    with:
      module: xq-scripts
      check_version_change: true
