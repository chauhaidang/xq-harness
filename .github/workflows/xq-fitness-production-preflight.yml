name: XQ Fitness production preflight

on:
  workflow_dispatch:

concurrency:
  group: xq-fitness-production-preflight
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Prefer monorepo names; fall back to standalone CI names already in use.
      XQ_FITNESS_DATABASE_URL: ${{ secrets.XQ_FITNESS_DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.NEON_DATASOURCE_URL }}
      XQ_RECORDS_DATABASE_URL: ${{ secrets.XQ_RECORDS_DATABASE_URL }}
      XQ_FITNESS_NEON_API_KEY: ${{ secrets.XQ_FITNESS_NEON_API_KEY || secrets.NEON_API_KEY }}
      XQ_RECORDS_NEON_API_KEY: ${{ secrets.XQ_RECORDS_NEON_API_KEY || secrets.NEON_API_KEY || secrets.XQ_FITNESS_NEON_API_KEY }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_READ_TOKEN || secrets.DO_TOKEN }}
      XQ_FITNESS_NEON_PROJECT_ID: ${{ vars.XQ_FITNESS_NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
      XQ_RECORDS_NEON_PROJECT_ID: ${{ vars.XQ_RECORDS_NEON_PROJECT_ID || vars.NEON_RECORDS_PROJECT_ID }}
      # From standalone xq-fitness-write CI defaults / archived .do/app.yaml
      DO_APP_ID: ${{ vars.DO_APP_ID || '7960143e-c80f-496d-9992-f24430bb77ff' }}
      DO_SERVICE_NAME: ${{ vars.DO_SERVICE_NAME || 'write-service' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install read-only capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_READ_TOKEN || secrets.DO_TOKEN }}

      - name: Verify sanitization policy
        run: node --test scripts/test-xq-fitness-preflight-sanitization.mjs

      - name: Validate required protected inputs
        run: |
          missing=0
          for name in \
            XQ_FITNESS_DATABASE_URL \
            XQ_RECORDS_DATABASE_URL \
            XQ_FITNESS_NEON_API_KEY \
            XQ_RECORDS_NEON_API_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            XQ_FITNESS_NEON_PROJECT_ID \
            XQ_RECORDS_NEON_PROJECT_ID \
            DO_APP_ID \
            DO_SERVICE_NAME
          do
            if [ -z "${!name}" ]; then
              echo "missing required input: $name"
              missing=1
            else
              echo "present: $name"
            fi
          done
          exit "$missing"

      - name: Capture read-only production evidence
        run: scripts/xq-fitness-production-preflight.sh "$RUNNER_TEMP/xq-fitness-production-preflight"

      - name: Enforce sanitized evidence contract
        if: always()
        run: node scripts/validate-xq-fitness-preflight-evidence.mjs "$RUNNER_TEMP/xq-fitness-production-preflight"

      - name: Build durable commit-ready manifest
        run: |
          mkdir -p "$RUNNER_TEMP/xq-fitness-production-preflight-durable"
          capture_date="$(date -u +%Y-%m-%d)"
          node scripts/build-xq-fitness-preflight-manifest.mjs \
            "$RUNNER_TEMP/xq-fitness-production-preflight" \
            "$RUNNER_TEMP/xq-fitness-production-preflight-durable/xq-fitness-production-preflight-${capture_date}.md"
          node scripts/validate-xq-fitness-preflight-evidence.mjs "$RUNNER_TEMP/xq-fitness-production-preflight"
          git diff --check

      - name: Upload protected short-lived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xq-fitness-production-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xq-fitness-production-preflight/**
          if-no-files-found: error
          retention-days: 1

      - name: Upload durable manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: xq-fitness-production-preflight-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xq-fitness-production-preflight-durable/xq-fitness-production-preflight-*.md
          if-no-files-found: error
          retention-days: 1
