name: CD xq-test-infra

on:
  push:
    branches: [main]
    paths:
      - modules/xq-test-infra/version.yaml
      - modules/xq-test-infra/package.json
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the published package without publishing
        required: false
        type: boolean
        default: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.v.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bump
        id: v
        run: python3 scripts/check-registry-version-changes.py --module xq-test-infra

  publish:
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.verify_only != 'true')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/module-cd-github-packages.yml
    secrets: inherit
    with:
      module: xq-test-infra

  verify-published:
    needs: version-check
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@chauhaidang"

      - name: Verify published package from a clean consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version="$(node -p "require('./modules/xq-test-infra/package.json').version")"
          package_artifact_dir="$RUNNER_TEMP/published-package"
          consumer_dir="$(mktemp -d)"
          mkdir -p "$package_artifact_dir"
          npm pack "@chauhaidang/xq-harness-test-infra@$package_version" --pack-destination "$package_artifact_dir"
          shasum "$package_artifact_dir"/*.tgz
          cd "$consumer_dir"
          npm init --yes
          npm install --ignore-scripts --save-exact "@chauhaidang/xq-harness-test-infra@$package_version"
          test "$(./node_modules/.bin/xq-infra --version)" = "$package_version"
          node -e "const lock = require('./package-lock.json'); const invalid = JSON.stringify(lock).match(/(file:|link:|portal:|workspace:)/); if (invalid) throw new Error('local dependency protocol found')"

      - name: Upload verified published package
        uses: actions/upload-artifact@v4
        with:
          name: xq-test-infra-published-package
          path: ${{ runner.temp }}/published-package/*.tgz
          if-no-files-found: error
          retention-days: 7
