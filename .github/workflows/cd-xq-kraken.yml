name: CD xq-kraken

on:
  push:
    branches: [main]
    paths:
      - modules/xq-kraken/version.yaml
      - modules/xq-kraken/pyproject.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bump
        id: version
        run: python3 scripts/check-registry-version-changes.py --module xq-kraken

  release:
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate release version
        id: version
        working-directory: modules/xq-kraken
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          REGISTRY_VERSION="$(yq -r '.version' version.yaml)"
          if [[ "${PYPROJECT_VERSION}" != "${REGISTRY_VERSION}" ]]; then
            echo "pyproject version ${PYPROJECT_VERSION} does not match version.yaml ${REGISTRY_VERSION}" >&2
            exit 1
          fi
          echo "version=${PYPROJECT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: CI gate
        run: ./scripts/module ci xq-kraken

      - name: Verify installed CLI
        working-directory: modules/xq-kraken
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BIN_DIR="$(uv tool dir --bin)"
          uv tool install --force "dist/xq_kraken-${VERSION}-py3-none-any.whl"
          WORKDIR="$(mktemp -d)"
          cat > "${WORKDIR}/widgets.yaml" <<'YAML'
          openapi: 3.1.0
          info:
            title: Widgets
            version: 1.0.0
          paths: {}
          YAML
          cat > "${WORKDIR}/kraken.yaml" <<'YAML'
          apis:
            widgets:
              spec: ./widgets.yaml
              base_url: http://127.0.0.1:1
          YAML
          (
            cd "${WORKDIR}"
            "${BIN_DIR}/kraken" execution start
            "${BIN_DIR}/kraken" scenario start
            "${BIN_DIR}/kraken" execution finish
            test ! -f .kraken/execution.sqlite
          )

      - name: Create checksums
        working-directory: modules/xq-kraken
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          (
            cd dist
            sha256sum \
              "xq_kraken-${VERSION}-py3-none-any.whl" \
              "xq_kraken-${VERSION}.tar.gz" \
              > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="xq-kraken-v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          # xq-kraken ${VERSION}

          ## Artifacts

          - \`xq_kraken-${VERSION}-py3-none-any.whl\` — installable Kraken CLI wheel
          - \`xq_kraken-${VERSION}.tar.gz\` — source distribution
          - \`SHA256SUMS\`

          ## Install

          \`\`\`bash
          uv tool install --force \\
            https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/xq_kraken-${VERSION}-py3-none-any.whl
          \`\`\`

          ## Validation

          - \`./scripts/module ci xq-kraken\`
          - installed \`kraken\` CLI smoke test
          - wheel and sdist checksums
          EOF
          gh release create "${TAG}" \
            --title "xq-kraken ${VERSION}" \
            --notes-file release-notes.md \
            "modules/xq-kraken/dist/xq_kraken-${VERSION}-py3-none-any.whl" \
            "modules/xq-kraken/dist/xq_kraken-${VERSION}.tar.gz" \
            "modules/xq-kraken/dist/SHA256SUMS"
