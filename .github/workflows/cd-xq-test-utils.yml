name: CD xq-test-utils

on:
  push:
    branches: [main]
    paths:
      - modules/xq-test-utils/version.yaml
      - modules/xq-test-utils/package.json
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the published package without publishing
        required: false
        type: boolean
        default: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.v.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bump
        id: v
        run: python3 scripts/check-registry-version-changes.py --module xq-test-utils

  publish:
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.verify_only != true)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/module-cd-github-packages.yml
    secrets: inherit
    with:
      module: xq-test-utils

  verify-published:
    needs: version-check
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@chauhaidang"

      - name: Verify published package from a clean consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version="$(node -p "require('./modules/xq-test-utils/package.json').version")"
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          npm init --yes
          npm install --ignore-scripts --save-exact "@chauhaidang/xq-harness-test-utils@$package_version"
          node -e "require('@chauhaidang/xq-harness-test-utils')"
          node -e "const lock = require('./package-lock.json'); const invalid = JSON.stringify(lock).match(/(file:|link:|portal:|workspace:)/); if (invalid) throw new Error('local dependency protocol found')"
