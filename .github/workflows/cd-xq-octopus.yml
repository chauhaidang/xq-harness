name: CD xq-octopus

on:
  push:
    branches: [main]
    paths:
      - modules/xq-octopus/version.yaml
      - modules/xq-octopus/package.json
  workflow_dispatch:

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.v.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bump
        id: v
        run: python3 scripts/check-registry-version-changes.py --module xq-octopus

  publish:
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify npm
        run: npm --version

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: CI gate before publish
        run: ./scripts/module ci xq-octopus

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd modules/xq-octopus
          npm publish
