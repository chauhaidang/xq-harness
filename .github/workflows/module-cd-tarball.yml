name: Module CD (Tarball release)

on:
  workflow_call:
    inputs:
      module:
        description: Module registry key (e.g. xq-scripts)
        required: true
        type: string
      version_file:
        description: Path to a declared mirror file relative to module directory
        required: false
        type: string
        default: VERSION
      tag_prefix:
        description: Git tag prefix (e.g. xq-scripts/v)
        required: false
        type: string
        default: xq-scripts/v
      archive_prefix:
        description: Archive filename prefix
        required: false
        type: string
        default: xq-scripts-v
      check_version_change:
        description: Release only when the module's version.yaml version changed from the previous commit
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  version-check:
    if: inputs.check_version_change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        env:
          MODULE: ${{ inputs.module }}
        run: python3 scripts/check-registry-version-changes.py --module "$MODULE"

  release:
    needs: version-check
    if: always() && (inputs.check_version_change == false || needs.version-check.outputs.version_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE="${{ inputs.module }}"
          TAG_PREFIX="${{ inputs.tag_prefix }}"
          ARCHIVE_PREFIX="${{ inputs.archive_prefix }}"
          python3 scripts/validate-module-versions.py --module "$MODULE"
          MODULE_PATH="$(yq -r ".modules[\"${MODULE}\"].path" modules.yaml)"
          VERSION="$(yq -r '.version' "${MODULE_PATH}/version.yaml")"
          TAG="${TAG_PREFIX}${VERSION}"
          ARCHIVE="${ARCHIVE_PREFIX}${VERSION}.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          tar -czf "$ARCHIVE" \
            --transform "s|^modules/${MODULE}|${ARCHIVE_PREFIX}${VERSION}|" \
            "modules/${MODULE}"
          PREV_TAG=$(git tag --list "${TAG_PREFIX}*" --sort=-version:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --oneline -- "modules/${MODULE}/" | sed 's/^/- /')
          else
            NOTES=$(git log --oneline -- "modules/${MODULE}/" | sed 's/^/- /')
          fi
          [ -z "$NOTES" ] && NOTES="- Initial release"
          gh release create "$TAG" --title "${MODULE} v${VERSION}" --notes "$NOTES" "$ARCHIVE"
