name: CI xq-test-infra

on:
  pull_request:
    paths: &paths
      - modules/xq-test-infra/**
      - modules/xq-common-kit/**
      - modules.yaml
      - modules/xq-test-infra/version.yaml
      - scripts/module
      - scripts/check-registry-version-changes.py
      - scripts/validate-module-versions.py
      - .github/workflows/ci-xq-test-infra.yml
      - .github/workflows/module-*.yml
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ci-xq-test-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/module-ci-node.yml
    with:
      module: xq-test-infra
